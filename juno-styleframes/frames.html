<!doctype html>
<html><head><meta charset="utf-8"><title>Juno Style Frames v2</title>
<style>
@font-face{font-family:Outfit;font-weight:300;src:url(../public/juno/fonts/Outfit-300.woff2)}
@font-face{font-family:Outfit;font-weight:400;src:url(../public/juno/fonts/Outfit-400.woff2)}
@font-face{font-family:Outfit;font-weight:500;src:url(../public/juno/fonts/Outfit-500.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#f{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Outfit,sans-serif}
.abs{position:absolute}
.cap{font-weight:400;font-size:26px;letter-spacing:.1em;text-transform:uppercase}
.step{position:relative;display:block;width:fit-content;font-weight:400;letter-spacing:-.035em;line-height:1;padding:.06em .2em .14em .1em;overflow:hidden}
.step .ht{position:absolute;inset:0;background-image:radial-gradient(rgba(4,51,41,.28) 1.4px,transparent 1.9px);background-size:10px 10px;-webkit-mask-image:linear-gradient(90deg,transparent 15%,#000 100%)}
.step span{position:relative}
</style></head>
<body><div id="f"></div>
<script>
const A='../public/juno/';
const q=new URLSearchParams(location.search); const theme=q.get('theme')||'dark'; const frame=q.get('frame')||'a1'; const guides=q.get('guides');
const D=theme==='dark';
const C={bg:D?'#043329':'#F8F9FA',green:'#1CE49B',light:'#B4F7CA',ink:D?'#F8F9FA':'#043329',inkSoft:D?'rgba(248,249,250,.62)':'rgba(4,51,41,.6)',
  line:D?'rgba(28,228,155,.55)':'rgba(4,51,41,.35)',faint:D?'rgba(180,247,202,.16)':'rgba(4,51,41,.1)',
  dot:'#1CE49B',ghost:D?'rgba(28,228,155,.22)':'rgba(4,51,41,.12)',shadow:D?'rgba(0,0,0,.42)':'rgba(4,51,41,.16)',
  mark:D?'mark_green.png':'mark_dark.png'};
const F=document.getElementById('f'); const add=h=>F.insertAdjacentHTML('beforeend',h);
const svgOpen='<svg class="abs" style="left:0;top:0;overflow:visible" width="1080" height="1920">';

// ---------- primitives ----------
function bg(){ add(`<div class="abs" style="inset:0;background:${C.bg}"></div>`);
  if(!D) add(`<div class="abs" style="inset:0;background-image:radial-gradient(rgba(4,51,41,.07) 1.3px,transparent 1.8px);background-size:36px 36px"></div>`); }
function stepped(lines,size,opt={}){ // "buy a Piece of it" stepped halftone block
  return `<div style="display:flex;flex-direction:column;align-items:flex-start">${lines.map(l=>`<div class="step" style="font-size:${size}px;color:#043329;background:linear-gradient(90deg,${C.light} 0%,${C.green} 100%);${opt.op?`opacity:${opt.op};`:''}"><div class="ht"></div><span>${l}</span></div>`).join('')}</div>`;
}
// text group. anchor y = where the stepped block's top sits (on a thirds line)
function textGroup({x=108,y,caption,lead,lines,size=150,leadSize=72,extra='',clipFx=''}){
  add(`<div class="abs" style="left:${x}px;top:${y}px;transform:translateY(-100%)"><div class="cap" style="color:${C.green};margin-bottom:26px">${caption}</div><div style="font-weight:300;font-size:${leadSize}px;letter-spacing:-.02em;color:${C.ink};line-height:1.05;margin-bottom:22px">${lead}</div></div>`);
  add(`<div class="abs" style="left:${x}px;top:${y}px;${clipFx}">${stepped(lines,size)}${extra}</div>`);
}
const dot=(x,y,r=40,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.fill||C.dot}" ${o.op!=null?`opacity="${o.op}"`:''} ${o.dash?`fill="none" stroke="${C.line}" stroke-width="3" stroke-dasharray="6 9"`:''} ${o.blur?`filter="url(#b${o.blur})"`:''}/>`;
const defs=()=>`<defs>${[4,8,14].map(b=>`<filter id="b${b}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${b}"/></filter>`).join('')}
 <filter id="mbx" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22 3"/></filter></defs>`;
function trail(x1,y1,x2,y2,bend,id,w=6){
  const mx=(x1+x2)/2+bend[0],my=(y1+y2)/2+bend[1];
  return `<linearGradient id="t${id}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${C.dot}" stop-opacity="0"/><stop offset="1" stop-color="${C.dot}" stop-opacity=".85"/></linearGradient>
  <path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="url(#t${id})" stroke-width="${w}" stroke-linecap="round"/>`;
}
// long soft shadow (refs: pencil/coffee/clip) cast to bottom-right at 45deg
function longShadow(cx,cy,half,L=620,id='s'){
  const k=Math.SQRT1_2, dx=half*k, dy=-half*k;
  const p1=[cx+dx,cy+dy],p2=[cx-dx,cy-dy],p3=[p2[0]+L*k,p2[1]+L*k],p4=[p1[0]+L*k,p1[1]+L*k];
  return `${svgOpen}<defs><linearGradient id="ls${id}" gradientUnits="userSpaceOnUse" x1="${cx}" y1="${cy}" x2="${cx+L*k}" y2="${cy+L*k}"><stop offset="0" stop-color="${C.shadow}"/><stop offset="1" stop-color="${C.shadow}" stop-opacity="0"/></linearGradient></defs>
   <polygon points="${[p1,p2,p3,p4].map(p=>p.join(',')).join(' ')}" fill="url(#ls${id})"/></svg>`;
}
function icon(src,cx,cy,w,o={}){
  if(o.shadow!==false) add(longShadow(cx+w*.05,cy+w*.18,w*.36,o.L||560,src+cx));
  add(`<img class="abs" src="${A+src}" style="left:${cx-w/2}px;top:${cy-w/2}px;width:${w}px;${o.rot?`transform:rotate(${o.rot}deg);`:''}${o.blur?`filter:blur(${o.blur}px);`:''}${o.op?`opacity:${o.op};`:''}">`);
}
function mark(cx,cy,w,o={}){ const s=w/411, d=337*s*.98; add(`<div class="abs" style="left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:${C.bg};${o.blur?`filter:blur(${o.blur}px);`:''}"></div>`); add(`<img class="abs" src="${A+C.mark}" style="left:${cx-168.5*s}px;top:${cy-168.5*s}px;width:${w}px;${o.blur?`filter:blur(${o.blur}px);`:''}${o.op!=null?`opacity:${o.op}`:''}">`); }
function chip(x,y,text){ // product-demo status chip ("Passed")
  add(`<div class="abs" style="left:${x}px;top:${y}px;display:flex;align-items:center;gap:10px;padding:10px 20px 10px 12px;border-radius:999px;background:${D?'rgba(180,247,202,.14)':'#fff'};border:1.5px solid ${D?'rgba(180,247,202,.35)':'rgba(4,51,41,.12)'};color:${C.ink};font-size:30px;font-weight:400;box-shadow:${D?'none':'0 10px 30px rgba(4,51,41,.1)'}">
   <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="15" fill="${C.green}"/><path d="M9 15.5l4 4 8-9" fill="none" stroke="#043329" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>${text}</div>`);
}
function cursor(x,y,s=1){ add(`<svg class="abs" style="left:${x}px;top:${y}px" width="${54*s}" height="${54*s}" viewBox="0 0 30 30"><path d="M3 3 L27 12 L16 16 L12 27 Z" fill="${D?'#F8F9FA':'#043329'}" stroke="${D?'#043329':'#fff'}" stroke-width="2" stroke-linejoin="round"/></svg>`); }
function bug(){ add(`<img class="abs" src="${A}${D?'logo_light.png':'logo_dark.png'}" style="right:108px;top:1740px;width:140px;opacity:.75">`); }
function tag(text,x,y){ add(`<div class="abs cap" style="left:${x}px;top:${y}px;font-size:20px;color:${C.inkSoft}">${text}</div>`); }
function thirds(){ if(!guides) return; add(`${svgOpen}${[360,720].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="1920" stroke="magenta" stroke-width="2"/>`).join('')}${[640,1280].map(y=>`<line x1="0" y1="${y}" x2="1080" y2="${y}" stroke="magenta" stroke-width="2"/>`).join('')}</svg>`); }


// ---------- background geometry (refs: OSS patterns / ecosystem grid / multi-source card) ----------
const G={line:D?'rgba(180,247,202,.13)':'rgba(4,51,41,.10)',node:D?'rgba(180,247,202,.38)':'rgba(4,51,41,.26)',acc:D?'rgba(28,228,155,.55)':'rgba(18,184,124,.55)',big:D?'rgba(248,249,250,.55)':'rgba(4,51,41,.45)'};
function rng(seed){return()=>((seed=(seed*16807)%2147483647)/2147483647);}
const sq=(x,y,s,c)=>`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" fill="${c}"/>`;
function geoStar(cx,cy,R,n,seed=3,big=false){const r=rng(seed);let o='',pts=[];
 for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+r()*.3,rr=R*(.75+r()*.35);pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
 pts.forEach((p,i)=>{o+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="${G.line}" stroke-width="1.5"/>`;const q=pts[(i+3)%n];o+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${G.line}" stroke-width="1"/>`;});
 pts.forEach((p,i)=>o+=sq(p[0],p[1],11,i%4==1?G.acc:G.node)); if(big)o+=sq(cx,cy,34,G.big); return o;}
function geoHull(cx,cy,w,h,n=10,seed=7){const r=rng(seed);let o='';const L=[cx-w/2,cy],Rr=[cx+w/2,cy],pts=[];
 for(let i=0;i<n;i++){const t=(i+.5)/n,top=i%2==0;const x=cx-w/2+w*(.12+.76*((i/2|0)/(n/2-1||1)));const y=cy+(top?-1:1)*h/2*(.55+r()*.45);pts.push([x,y]);}
 pts.forEach((p,i)=>{o+=`<line x1="${L[0]}" y1="${L[1]}" x2="${p[0]}" y2="${p[1]}" stroke="${G.line}" stroke-width="1.2"/><line x1="${Rr[0]}" y1="${Rr[1]}" x2="${p[0]}" y2="${p[1]}" stroke="${G.line}" stroke-width="1.2"/>`;});
 o+=`<line x1="${L[0]}" y1="${L[1]}" x2="${Rr[0]}" y2="${Rr[1]}" stroke="${G.line}" stroke-width="1.2"/>`;
 [L,Rr,...pts].forEach((p,i)=>o+=sq(p[0],p[1],12,i==4||i==7?G.acc:G.node)); return o;}
function geoGrid(x0,y0,cols,rows,cell,seed=11){const r=rng(seed);let o='';
 for(let c=0;c<=cols;c++)o+=`<line x1="${x0+c*cell}" y1="${y0}" x2="${x0+c*cell}" y2="${y0+rows*cell}" stroke="${G.line}" stroke-width="1"/>`;
 for(let k=0;k<=rows;k++)o+=`<line x1="${x0}" y1="${y0+k*cell}" x2="${x0+cols*cell}" y2="${y0+k*cell}" stroke="${G.line}" stroke-width="1"/>`;
 const seeds=[[3,2],[cols-4,4],[5,rows-3],[cols-3,rows-2]];
 seeds.forEach(([sc,sr])=>{for(let i=0;i<14;i++){const c=sc+Math.round((r()-.5)*5),k=sr+Math.round((r()-.5)*4);if(c<0||k<0||c>=cols||k>=rows)continue;const v=r();
   o+=sq(x0+(c+.5)*cell,y0+(k+.5)*cell,cell*(v>.85?.62:v>.5?.4:.24),v>.8?G.acc:G.node);}});
 o+=sq(x0+(cols-5.5)*cell,y0+3.5*cell,cell*.8,G.big); return o;}
function geoDoc(x,y,w,h){let o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${G.node}" stroke-width="1.5"/><rect x="${x-14}" y="${y-14}" width="${w+28}" height="${h+28}" fill="none" stroke="${G.line}" stroke-width="1"/>
 <circle cx="${x+50}" cy="${y+56}" r="22" fill="none" stroke="${G.node}" stroke-width="1.5"/><line x1="${x+28}" y1="${y+56}" x2="${x+72}" y2="${y+56}" stroke="${G.node}" stroke-width="1.5"/>
 <text x="${x+90}" y="${y+64}" font-family="Outfit" font-size="20" letter-spacing="3" fill="${G.node}">WORKFLOW</text>`;
 const bars=[.28,.55,.4,.62,.33,.7,.48];bars.forEach((b,i)=>{const yy=y+120+i*44;o+=`<rect x="${x+30}" y="${yy}" width="${w-60}" height="18" fill="none" stroke="${G.line}" stroke-width="1"/><rect x="${x+30}" y="${yy}" width="${(w-60)*b}" height="18" fill="${i==3?G.acc:G.node}" opacity="${1-i*.08}"/>`;});
 [0,1,2,3].forEach(i=>{const yy=y+140+i*90;o+=`<rect x="${x-300}" y="${yy-14}" width="28" height="28" rx="6" fill="none" stroke="${G.node}" stroke-width="1.5"/><line x1="${x-272}" y1="${yy}" x2="${x-14}" y2="${yy}" stroke="${G.line}" stroke-width="1.2"/>`+sq(x-220+i*45,yy,10,i%2?G.acc:G.node);});
 return o;}
function geo(svgInner,op=1){add(`<svg class="abs" style="left:0;top:0;opacity:${op}" width="1080" height="1920">${svgInner}</svg>`);}

// orbit system around a hub
function orbit(cx,cy,R,n,offset=0,o={}){
  let s=''; for(let i=0;i<n;i++){const a=(offset+i*360/n)*Math.PI/180; const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
   if(o.tether) s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${C.line}" stroke-width="2.5"/>`;
   s+=dot(x,y,o.r||38,{blur:o.blur,op:o.op});} return s;
}

// ---------- FRAMES (thirds: x 360/720, y 640/1280) ----------
const FR={
 // 01 ATTRACT — key. Text on upper third; hub on lower-right power point (720,1280)
 a1(){ bg(); geo(geoStar(720,1280,560,14,3));
  textGroup({y:640,caption:'01 / Attract',lead:"They'll attract",lines:['talent'],size:170});
  const hx=720,hy=1280;
  let s=svgOpen+defs();
  s+=`<circle cx="${hx}" cy="${hy}" r="250" fill="none" stroke="${C.faint}" stroke-width="2"/><circle cx="${hx}" cy="${hy}" r="400" fill="none" stroke="${C.faint}" stroke-width="2" stroke-dasharray="3 12"/>`;
  [[ -60,1080, 470,1150,[ -40,-120]],[ 160,1900, 520,1440,[-160,20]],[1140,1720, 930,1460,[120,40]],[-80,1580, 330,1330,[0,90]],[1150,950, 940,1120,[40,-80]]].forEach((t,i)=>{s+=trail(t[0],t[1],t[2],t[3],t[4],'a'+i);s+=dot(t[2],t[3],i==4?30:40);});
  s+=dot(260,1700,30,{op:.35,blur:4})+dot(1010,880,22,{op:.3,blur:4})+dot(140,1180,18,{op:.25});
  add(s+'</svg>'); mark(hx,hy,240); bug(); thirds(); },

 // transition attract -> retain: word swap mid-way, dots spiralling in, camera push on hub
 a2(){ bg(); geo(geoStar(640,1260,520,14,5),.8);
  add(`<div class="abs" style="left:108px;top:640px;transform:translateY(-100%)"><div class="cap" style="color:${C.green};margin-bottom:26px">01 → 02</div>
   <div style="position:relative;height:150px;overflow:hidden;margin-bottom:22px;width:800px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%)">
    <div style="position:absolute;top:0;font-weight:300;font-size:72px;color:${C.ink};filter:blur(4px)">They'll attract</div>
    <div style="position:absolute;top:70px;font-weight:300;font-size:72px;color:${C.ink};filter:blur(.6px)">They'll retain</div></div></div>`);
  add(`<div class="abs" style="left:108px;top:640px">${stepped(['talent'],170)}</div>`);
  const hx=640,hy=1260; let s=svgOpen+defs();
  s+=`<circle cx="${hx}" cy="${hy}" r="300" fill="none" stroke="${C.faint}" stroke-width="2"/>`;
  for(let i=0;i<6;i++){const a0=(i*60+20)*Math.PI/180,a1=(i*60+70)*Math.PI/180;const r0=470,r1=310;
   const x0=hx+r0*Math.cos(a0),y0=hy+r0*Math.sin(a0),x1=hx+r1*Math.cos(a1),y1=hy+r1*Math.sin(a1);
   s+=`<path d="M${x0} ${y0} Q${hx+420*Math.cos((a0+a1)/2)} ${hy+420*Math.sin((a0+a1)/2)} ${x1} ${y1}" fill="none" stroke="${C.dot}" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" filter="url(#b4)"/>`;
   s+=dot(x1,y1,38,{blur:4});}
  add(s+'</svg>'); mark(hx,hy,280,{blur:2}); bug(); thirds(); },

 // 02 RETAIN — key. Text upper third; orbit network centred on lower third; stamp accent
 r1(){ bg(); geo(geoHull(540,1280,1000,620,10,7));
  textGroup({y:640,caption:'02 / Retain',lead:"They'll retain",lines:['talent'],size:170});
  const hx=540,hy=1280; let s=svgOpen+defs();
  s+=`<circle cx="${hx}" cy="${hy}" r="300" fill="none" stroke="${C.faint}" stroke-width="2"/>`;
  s+=orbit(hx,hy,300,6,-90,{tether:true}); add(s+'</svg>'); mark(hx,hy,220);
  chip(hx+150+50,hy-260-34,'Retained');
  icon('icon_stamp.png',210,1610,220,{L:420}); bug(); thirds(); },

 // transition retain -> grow: camera push THROUGH the "o." (Juno film move)
 r2(){ bg(); geo(geoGrid(0,0,20,36,54,13),.5);
  mark(540,960,2600,{op:1});
  let s=svgOpen+defs(); for(let i=0;i<6;i++){const a=(i*60-90)*Math.PI/180; const x=540+760*Math.cos(a),y=960+760*Math.sin(a); s+=dot(x,y,90,{blur:14,op:.8});}
  add(s+'</svg>');
  add(`<div class="abs" style="left:0;right:0;top:960px;transform:translateY(-50%);text-align:center;font-weight:300;font-size:72px;color:${C.ink};filter:blur(2px);opacity:.7">and they'll grow…</div>`);
  add(`<div class="abs cap" style="left:108px;top:420px;color:${C.green}">02 → 03 · push through</div>`); bug(); thirds(); },

 // 03 GROW — key. Graphic owns upper 2/3; text anchored on lower third line
 g1(){ bg(); geo(geoGrid(54,162,18,20,54,11),.5);
  const hx=540,hy=720; let s=svgOpen+defs();
  // same 6 people (no new dots) + 3 digital teammates
  const team=[[300,560],[780,520],[220,840],[860,860],[420,1000],[660,1020]];
  const tools=[[540,330],[170,1110],[930,1150]];
  team.forEach(p=>s+=`<line x1="${hx}" y1="${hy}" x2="${p[0]}" y2="${p[1]}" stroke="${C.line}" stroke-width="2.5"/>`);
  tools.forEach(p=>s+=`<line x1="${hx}" y1="${hy}" x2="${p[0]}" y2="${p[1]}" stroke="${C.green}" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>`);
  team.forEach(p=>s+=dot(p[0],p[1],38));
  add(s+'</svg>');
  icon('icon_typewriter.png',540,330,210,{L:380}); icon('icon_chess.png',170,1110,190,{L:360}); icon('icon_stamp.png',930,1150,190,{L:330});
  tag('Assistant',470,450); tag('Advisor',110,1220); tag('Reviewer',858,1255);
  mark(hx,hy,170);
  textGroup({y:1500,caption:'03 / Grow',lead:"and they'll grow",lines:['without','hiring'],size:150});
  add(`<div class="abs" style="left:720px;top:1530px;width:260px"><div class="cap" style="font-size:20px;color:${C.inkSoft}">New hires</div><div style="font-weight:300;font-size:120px;line-height:1;color:${C.green}">0</div></div>`);
  bug(); thirds(); },

 // transition grow -> reframe: network collapses into the 3x4 talent grid (prototype), icons lift out
 g2(){ bg(); geo(geoGrid(54,162,18,26,54,17),.45);
  let s=svgOpen+defs();
  const grid=[];for(let r=0;r<4;r++)for(let c=0;c<3;c++)grid.push([620+c*130,980+r*130]);
  const from=[[300,560],[780,520],[220,840],[860,860],[420,1000],[660,1020]];
  grid.forEach((g,i)=>{ if(i<6){const f=from[i];const mx=(f[0]+g[0])/2,my=(f[1]+g[1])/2; s+=`<line x1="${f[0]}" y1="${f[1]}" x2="${mx}" y2="${my}" stroke="${C.dot}" stroke-opacity=".3" stroke-width="40" stroke-linecap="round" filter="url(#b8)"/>`; s+=dot(mx+(g[0]-mx)*.4,my+(g[1]-my)*.4,48,{blur:4});} else s+=dot(g[0],g[1],48*.6,{op:.5}); });
  add(s+'</svg>');
  icon('icon_typewriter.png',520,220,170,{blur:6,op:.6,shadow:false}); icon('icon_chess.png',110,700,150,{blur:6,op:.5,shadow:false});
  add(`<div class="abs" style="left:108px;top:1280px;transform:translateY(-100%)"><div class="cap" style="color:${C.green};margin-bottom:26px">03 → 04</div><div style="font-weight:300;font-size:72px;color:${C.ink};opacity:.85">Your talent</div></div>`);
  bug(); thirds(); },

 // 04 REFRAME — transition: strike drawing across "problem", cursor glides in (product-demo idiom)
 p1(){ bg(); geo(geoDoc(600,1080,400,520),.45); reframe(.55,false); bug(); thirds(); },
 // 04 REFRAME — key
 p2(){ bg(); geo(geoDoc(600,1080,400,520),.4); reframe(1,true); bug(); thirds(); },

 end(){ add(`<div class="abs" style="inset:0;background:${C.bg}"></div>`); geo(geoHull(540,960,1100,700,12,21),.7);
  const w=360,h=w*337/1327,y=960-h/2, ghost=D?'logo_white.png':'logo_dark.png';
  add(`<img class="abs" src="${A+ghost}" style="left:${540-w*1.5-60}px;top:${y}px;width:${w}px;opacity:.08"><img class="abs" src="${A+ghost}" style="left:${540+w/2+60}px;top:${y}px;width:${w}px;opacity:.08">
   <img class="abs" src="${A}${D?'logo_green.png':'logo_duo_dark.png'}" style="left:${540-w/2}px;top:${y}px;width:${w}px">
   <div class="abs cap" style="left:0;right:0;top:${y+h+110}px;text-align:center;font-size:28px;color:${D?'#B4F7CA':'#043329'};opacity:.8">File Better. Feel Better.</div>`); thirds(); }
};
function reframe(p,done){
  // talent grid (people intact) on right third, lower
  let s=svgOpen+defs();
