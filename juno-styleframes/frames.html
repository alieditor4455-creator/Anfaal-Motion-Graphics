<!doctype html>
<html><head><meta charset="utf-8"><title>Juno Style Frames v3</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(../public/juno/fonts/Outfit-400.woff2)}
@font-face{font-family:Outfit;font-weight:500;src:url(../public/juno/fonts/Outfit-500.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(../public/juno/fonts/Outfit-700.woff2)}
@font-face{font-family:Caveat;font-weight:500;src:url(../public/juno/fonts/Caveat-500.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#f{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Outfit,sans-serif}
.abs{position:absolute}
.lead{font-weight:400;font-size:64px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.main{font-weight:700;font-size:132px;letter-spacing:-.045em;line-height:.98;white-space:nowrap}
.cap{font-weight:400;font-size:24px;letter-spacing:.12em;text-transform:uppercase}
.note{font-family:Caveat;font-weight:500;font-size:50px;white-space:nowrap}
</style></head>
<body><div id="f"></div>
<script>
/* Layout = client prototype guide (scaled 1.8x): text block left 205 / top 306; one graphic centred (540,1075).
   Type + illustration language = client-approved "the teammate / you never had." frames. */
const A='../public/juno/';
const q=new URLSearchParams(location.search); const theme=q.get('theme')||'dark'; const frame=q.get('frame')||'a1';
const D=theme==='dark';
const C={bg:D?'#043329':'#F8F9FA',green:'#1CE49B',ink:D?'#F8F9FA':'#043329',soft:D?'rgba(248,249,250,.72)':'rgba(4,51,41,.72)',
  muted:D?'rgba(248,249,250,.32)':'rgba(4,51,41,.28)',line:D?'rgba(28,228,155,.85)':'rgba(4,51,41,.5)',
  hair:D?'rgba(180,247,202,.22)':'rgba(4,51,41,.16)',mark:D?'mark_green.png':'mark_dark.png'};
const TX=205,TY=306,CX=540,CY=1075,R=79,P=198;
const F=document.getElementById('f'); const add=h=>F.insertAdjacentHTML('beforeend',h);
const S=inner=>add(`<svg class="abs" style="left:0;top:0;overflow:visible" width="1080" height="1920"><defs>
  <filter id="mb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>${inner}</svg>`);
const dotP=`<span style="color:${C.green}">.</span>`;

function bg(){ add(`<div class="abs" style="inset:0;background:${C.bg}"></div>`);
  if(!D) add(`<div class="abs" style="inset:0;background-image:linear-gradient(rgba(4,51,41,.05) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(4,51,41,.05) 1.5px,transparent 1.5px);background-size:54px 54px"></div>`);
  else add(`<div class="abs" style="inset:0;background-image:linear-gradient(rgba(180,247,202,.035) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(180,247,202,.035) 1.5px,transparent 1.5px);background-size:54px 54px"></div>`); }
// lead (small, lowercase) + main (bold, lowercase, green Juno period)
function title(lead,main,o={}){ add(`<div class="abs" style="left:${TX}px;top:${TY}px;color:${C.ink}">
  ${lead?`<div class="lead" style="color:${C.soft};margin-bottom:6px">${lead}</div>`:''}${main.map((m,i)=>`<div class="main">${m}${i==main.length-1&&!o.noDot?dotP:''}</div>`).join('')}</div>`); }
// Island-style masked roll on the lead line
function roll(oldT,newT,main=[],o={}){ add(`<div class="abs" style="left:${TX}px;top:${TY}px;color:${C.ink}">
  <div class="lead" style="height:1.9em;margin-top:-.8em;overflow:hidden;position:relative;width:860px;margin-bottom:6px;color:${C.soft};-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 62%)"><div style="position:absolute;top:0;filter:blur(3px)">${oldT}</div><div style="position:absolute;top:.85em;filter:blur(.8px)">${newT}</div></div>
  ${main.map((m,i)=>`<div class="main" style="${o.mainStyle||''}">${m}${i==main.length-1?dotP:''}</div>`).join('')}</div>`); }
// handwritten note + hand-drawn arrow
function note(t,x,y,ax,ay){ add(`<div class="abs note" style="left:${x}px;top:${y}px;color:${C.ink};transform:rotate(-4deg)">${t}</div>`);
  if(ax==null) return; const sx=x+70,sy=y+78; S(`<path d="M${sx} ${sy} C ${sx-30} ${sy+60}, ${ax-60} ${ay-40}, ${ax} ${ay}" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round"/>
   <path d="M${ax-26} ${ay-6} L${ax} ${ay} L${ax-10} ${ay-26}" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`); }
// ground line + chapter footer + sparse outline accents (circle / diamond)
function ground(ch){ S(`<line x1="${TX-40}" y1="1640" x2="${1080-TX+40}" y2="1640" stroke="${C.hair}" stroke-width="3"/>`);
  add(`<div class="abs cap" style="left:${TX-40}px;top:1676px;color:${C.soft}">${ch}</div>`); }
function accents(list){ S(list.map(([k,x,y,s])=>k=='c'?`<circle cx="${x}" cy="${y}" r="${s}" fill="none" stroke="${C.line}" stroke-width="2.5"/>`
  :`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" fill="none" stroke="${C.line}" stroke-width="2.5" transform="rotate(45 ${x} ${y})"/>`).join('')); }
const dot=(x,y,o={})=>`<circle cx="${x}" cy="${y}" r="${o.r||R}" fill="${C.green}" ${o.op!=null?`opacity="${o.op}"`:''}/>`;
function mark(cx,cy,w){ const s=w/411,d=337*s*.98;
  add(`<div class="abs" style="left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:${C.bg}"></div><img class="abs" src="${A+C.mark}" style="left:${cx-168.5*s}px;top:${cy-168.5*s}px;width:${w}px">`); }

const NET=[[-22,-252],[-263,-94],[266,-94],[-263,202],[266,202],[-11,281]].map(([x,y])=>[CX+x,CY+y]);
const GRID=[];for(let r=0;r<4;r++)for(let c=0;c<3;c++)GRID.push([CX+(c-1)*P*1.05, CY+40+(r-1.5)*P]);
const RING=[...Array(6)].map((_,i)=>{const a=(-90+i*60)*Math.PI/180;return[CX+290*Math.cos(a),CY+290*Math.sin(a)];});
const R2N=[0,2,4,5,3,1], N2G=[1,3,5,9,11,10];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const spokes=(pts,dash)=>pts.map(p=>`<line x1="${CX}" y1="${CY}" x2="${p[0]}" y2="${p[1]}" stroke="${C.line}" stroke-width="2.5" ${dash?'stroke-dasharray="2 11" stroke-linecap="round"':''}/>`).join('');

const FR={
 a1(){ bg(); title("they'll attract",['talent']);
  let o=''; RING.forEach((p,i)=>{const far=lerp([CX,CY],p,1.22), tail=lerp([CX,CY],p,1.75);
   o+=`<linearGradient id="t${i}" gradientUnits="userSpaceOnUse" x1="${tail[0]}" y1="${tail[1]}" x2="${far[0]}" y2="${far[1]}"><stop offset="0" stop-color="${C.green}" stop-opacity="0"/><stop offset="1" stop-color="${C.green}" stop-opacity=".35"/></linearGradient>
   <line x1="${tail[0]}" y1="${tail[1]}" x2="${far[0]}" y2="${far[1]}" stroke="url(#t${i})" stroke-width="${R*1.25}" stroke-linecap="round"/>`+dot(far[0],far[1]);});
  S(o); mark(CX,CY,200); note('the good ones find you',600,560,790,790); ground('Chapter 01 · Attract'); },
 a2(){ bg(); roll("they'll attract","they'll retain",['talent']);
  let o=`<circle cx="${CX}" cy="${CY}" r="290" fill="none" stroke="${C.hair}" stroke-width="2.5" stroke-dasharray="4 12"/>`;
  RING.forEach((p,i)=>{const a=(-90+i*60-26)*Math.PI/180, a0=(-90+i*60-72)*Math.PI/180; const x=CX+335*Math.cos(a),y=CY+335*Math.sin(a);
   o+=`<path d="M${CX+440*Math.cos(a0)} ${CY+440*Math.sin(a0)} A 390 390 0 0 1 ${x} ${y}" fill="none" stroke="${C.green}" stroke-opacity=".22" stroke-width="${R*1.2}" stroke-linecap="round" filter="url(#mb)"/>`+dot(x,y);});
  S(o); mark(CX,CY,210); ground('Chapter 01 → 02'); },
 r1(){ bg(); title("they'll retain",['talent']);
  S(`<circle cx="${CX}" cy="${CY}" r="290" fill="none" stroke="${C.hair}" stroke-width="3"/>`+RING.map(p=>dot(p[0],p[1])).join(''));
  mark(CX,CY,210); accents([['c',890,700,22],['d',180,1450,26]]); note('and they stay',620,640,720,760); ground('Chapter 02 · Retain'); },
 r2(){ bg(); roll("they'll retain","and they'll grow");
  let o=''; RING.forEach((p,i)=>{const n=lerp(p,NET[R2N[i]],.6), e=lerp([CX,CY],n,.55); o+=`<line x1="${CX}" y1="${CY}" x2="${e[0]}" y2="${e[1]}" stroke="${C.line}" stroke-width="2.5"/>`+dot(n[0],n[1]);});
  S(`<circle cx="${CX}" cy="${CY}" r="330" fill="none" stroke="${C.hair}" stroke-width="3" opacity=".6"/>`+o); mark(CX,CY,160); ground('Chapter 02 → 03'); },
 g1(){ bg(); title("and they'll grow",['without','hiring']);
  const T=[[CX-395,CY+420],[CX+395,CY+420]];
  S(spokes(NET)+spokes(T,true)+NET.map(p=>dot(p[0],p[1])).join('')); mark(CX,CY,150);
  [['icon_typewriter.png',T[0]],['icon_chess.png',T[1]]].forEach(([s,p])=>add(`<img class="abs" src="${A+s}" style="left:${p[0]-85}px;top:${p[1]-85}px;width:170px">`));
  note('same team, more capacity',335,1500); ground('Chapter 03 · Grow'); },
 g2(){ bg(); roll("and they'll grow","your talent");
  let o=''; NET.forEach((n,i)=>{const g=GRID[N2G[i]], m=lerp(n,g,.6), back=lerp(n,g,.15); o+=`<line x1="${back[0]}" y1="${back[1]}" x2="${m[0]}" y2="${m[1]}" stroke="${C.green}" stroke-opacity=".2" stroke-width="${R*1.6}" stroke-linecap="round" filter="url(#mb)"/>`+dot(m[0],m[1]);});
  GRID.forEach((g,i)=>{ if(!N2G.includes(i)) o+=dot(g[0],g[1],{r:R*.45,op:.45}); });
  S(o); ground('Chapter 03 → 04'); },
 p1(){ bg();
  add(`<div class="abs" style="left:${TX}px;top:${TY}px;color:${C.ink}"><div class="lead" style="color:${C.soft};margin-bottom:6px">your talent isn't the</div>
   <div class="main" style="position:relative;display:inline-block;color:${C.muted}">problem<span class="abs" style="left:-3%;width:106%;top:54%;height:14px;margin-top:-7px;background:${C.green};border-radius:99px"></span></div></div>`);
  S(GRID.map(g=>dot(g[0],g[1])).join('')); note('it was never them',600,610,700,720); ground('Chapter 04 · Reframe'); },
 p2(){ bg(); title("the problem is the",['workflow']);
  S(spokes(NET)+NET.map(p=>dot(p[0],p[1])).join('')); mark(CX,CY,150); accents([['d',900,1450,26],['c',170,760,20]]); ground('Juno handles · you advise'); },
 end(){ add(`<div class="abs" style="inset:0;background:${C.bg}"></div>`); const w=360,h=w*337/1327;
  add(`<img class="abs" src="${A}${D?'logo_green.png':'logo_duo_dark.png'}" style="left:${540-w/2}px;top:${960-h/2}px;width:${w}px">`); }
};
FR[frame]();
document.fonts.ready.then(()=>{document.body.dataset.ready=1});
</script></body></html>
